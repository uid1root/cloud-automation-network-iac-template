name: Checkov
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  Checkov:
    name: 'Check Terraform Vuls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform